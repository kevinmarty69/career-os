name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://career_os:career_os@127.0.0.1:54329/career_os
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: career-os-ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:up
      - run: pnpm db:test
      - run: pnpm test:integration:http
      - run: pnpm test:integration:correction
      - run: docker build -f Dockerfile.page-composer -t career-os-page-composer:test .
      - run: pnpm audit --prod --audit-level high
