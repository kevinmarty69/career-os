name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://career_os:career_os@127.0.0.1:54329/career_os
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: career-os-ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:up
      - run: pnpm db:test
      - run: pnpm test:integration:semantic
      - run: pnpm test:integration:http
      - run: pnpm test:integration:correction
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/application-dossier.spec.ts tests/e2e/screen-contract.spec.ts tests/e2e/accessibility.spec.ts tests/e2e/i18n.spec.ts tests/e2e/opportunities-ui.spec.ts tests/e2e/contact-input.spec.ts --project=chromium --project=mobile
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - run: docker build -f Dockerfile.page-composer -t career-os-page-composer:test .
      - run: pnpm audit --prod --audit-level high
