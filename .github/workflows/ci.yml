name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCAL_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:54339/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Start native PostgreSQL (no Docker)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17
          sudo pg_conftool 17 main set port 54339
          sudo pg_ctlcluster 17 main restart
          sudo -u postgres psql -p 54339 -c "ALTER USER postgres PASSWORD 'postgres';"
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - run: pnpm test:native pnpm verify:persisted
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium --project=mobile
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - run: pnpm audit --prod --audit-level high
