services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: career_os
      POSTGRES_DB: career_os
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - career_os_db:/var/lib/postgresql/data
      - ./supabase/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
      - ./supabase/migrations/0002_agent_ledger.sql:/docker-entrypoint-initdb.d/0002_agent_ledger.sql:ro
      - ./supabase/migrations/0003_private_capabilities.sql:/docker-entrypoint-initdb.d/0003_private_capabilities.sql:ro
      - ./supabase/migrations/0004_budget_reservations.sql:/docker-entrypoint-initdb.d/0004_budget_reservations.sql:ro
      - ./supabase/migrations/0005_better_auth.sql:/docker-entrypoint-initdb.d/0005_better_auth.sql:ro
      - ./supabase/migrations/0006_living_profiles.sql:/docker-entrypoint-initdb.d/0006_living_profiles.sql:ro
      - ./supabase/migrations/0007_persisted_agent_runs.sql:/docker-entrypoint-initdb.d/0007_persisted_agent_runs.sql:ro
      - ./supabase/migrations/0008_review_issue_decisions.sql:/docker-entrypoint-initdb.d/0008_review_issue_decisions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U career_os']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  career_os_db:
